name: barchasb
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: 17.1.0
  flutter_riverpod: 3.1.0
  dio: 5.9.1
  intl: 0.20.2
  shared_preferences: 2.5.4
  fpdart: 1.2.0
  flutter_localization: 0.3.3
  image_picker: 1.2.1
  file_picker: 10.3.10
  flutter_secure_storage: 10.0.0
  persian_datetime_picker: 3.2.0
  equatable: 2.1.0
  cached_network_image: 3.4.1
  logger: 2.7.0
  shimmer: 3.0.0
  smooth_page_indicator: 2.0.1
  url_launcher: 6.3.2
  jwt_decoder: 2.0.1
  flutter_launcher_icons: 0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_launcher_icons:
    android: true
    ios: true
    image_path: "assets/logo_light.png"
    min_sdk_android: 21

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
    - assets/backgrounds/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

    - family: IranSans
      fonts:
        - asset: assets/fonts/iran_sans/IRANSansMobile.ttf
        - asset: assets/fonts/iran_sans/IRANSansMobile_Bold.ttf
          weight: 700
        - asset: assets/fonts/iran_sans/IRANSansMobile_Black.ttf
          weight: 900
        - asset: assets/fonts/iran_sans/IRANSansMobile_Medium.ttf
          weight: 500
        - asset: assets/fonts/iran_sans/IRANSansMobile_Light.ttf
          weight: 300
        - asset: assets/fonts/iran_sans/IRANSansMobile_UltraLight.ttf
          weight: 200
